<!-- ===== CONTACT FORM ===== -->
<section class="px-16 py-24">

  <div class="text-center max-w-2xl mx-auto mb-12">
    <h2 class="text-4xl font-bold text-white">Ingin Tahu Lebih Lanjut?</h2>
    <p class="mt-4 text-slate-400 text-base leading-relaxed">
      Tinggalkan informasi Anda dan tim kami akan menghubungi untuk memberikan penjelasan lebih detail
    </p>
  </div>

  <div class="max-w-3xl mx-auto rounded-2xl bg-navy-card p-10">

    <form class="grid grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-6">

      <div>
        <label class="block text-white text-sm font-semibold mb-2">Siapa Nama Anda?</label>
        <div class="flex items-center gap-2 bg-navy-input rounded-lg px-4 py-3 border border-slate-700/50">
          <svg class="w-4 h-4 text-slate-400 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
          <input type="text" placeholder="Nama Lengkap" class="bg-transparent text-slate-300 text-sm placeholder-slate-500 outline-none w-full">
        </div>
      </div>

      <div>
        <label class="block text-white text-sm font-semibold mb-2">Rumah Sakit / Klinik Anda</label>
        <div class="flex items-center gap-2 bg-navy-input rounded-lg px-4 py-3 border border-slate-700/50">
          <svg class="w-4 h-4 text-slate-400 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
          <input type="text" placeholder="Nama Rumah Sakit" class="bg-transparent text-slate-300 text-sm placeholder-slate-500 outline-none w-full">
        </div>
      </div>

      <div>
        <label class="block text-white text-sm font-semibold mb-2">Email Anda</label>
        <div class="flex items-center gap-2 bg-navy-input rounded-lg px-4 py-3 border border-slate-700/50">
          <svg class="w-4 h-4 text-slate-400 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
          <input type="email" placeholder="email@faskes.com" class="bg-transparent text-slate-300 text-sm placeholder-slate-500 outline-none w-full">
        </div>
      </div>

      <div>
        <label class="block text-white text-sm font-semibold mb-2">Nomor Telepon / WA</label>
        <div class="flex items-center gap-2 bg-navy-input rounded-lg px-4 py-3 border border-slate-700/50">
          <svg class="w-4 h-4 text-slate-400 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
          <input type="tel" placeholder="081234567890" class="bg-transparent text-slate-300 text-sm placeholder-slate-500 outline-none w-full">
        </div>
      </div>

    </form>

    <div class="mt-8 flex justify-end">
      <button type="submit" class="bg-cyan text-navy-dark font-semibold text-sm px-6 py-3 rounded-lg hover:brightness-110 transition-all">
        Kirim Sekarang
      </button>
    </div>

  </div>

</section>
